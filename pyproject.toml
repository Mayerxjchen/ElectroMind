[project]
name = "electromind"
version = "0.7.20"
description = "Async Python agent library and terminal REPL (OpenAI-compatible Chat Completions + sandbox)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "gongyulei", email = "gongyulei@stu.xmu.edu.cn" },
]
requires-python = ">=3.11"
keywords = [
    "agent",
    "llm",
    "openai",
    "asyncio",
    "sandbox",
    "tools",
    "repl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "asyncssh>=2.24.0",
    "ddgs>=7",
    "docstring-parser>=0.18.0",
    "openai>=2.31.0",
    "prompt-toolkit>=3.0.52",
    "pyyaml>=6.0.3",
    "tiktoken>=0.7.0",
    "tomli-w>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Mayerxjchen/ElectroMind"
Documentation = "https://mayerxjchen.github.io/electromind/"

[project.optional-dependencies]
tokens = ["transformers>=4.40"]
ssh = ["asyncssh>=2.14"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
electromind = "app.cli:main"
electromind-openai = "electromind.trace.openai_export:main"
electromind-trace = "electromind.trace.view:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["electromind", "app"]
# 显式声明 sdist 收集范围，与 module-name 的动态模块发现解耦，双保险：
# 即使后端再次出现 find_roots 静默失效（0.8.x 已证实），src/** 也会被显式
# glob 收集，两种 archive 内容都确定。
source-include = ["src/**", "pyproject.toml", "README.md"]

# SKILL-8: bundle the built-in scientific skill bundle (skills/ with
# procedures/ + tools/ + knowledge/) into installed artifacts.  uv_build's
# `data` type installs the directory contents over the virtualenv root, so
# `electromind.skills.builtin.builtin_roots()` probes <sys.prefix>/skills.
[tool.uv.build-backend.data]
data = "skills"

[dependency-groups]
dev = [
    "asyncssh>=2.14",
    "coverage[toml]>=7.15.0",
    "fastapi>=0.115",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
    "uvicorn>=0.30",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as an async test",
]

[tool.coverage.run]
# 只统计业务代码，排除测试、示例、文档
source = ["src"]
branch = true                  # 分支覆盖（if/else 两条腿都算），比行覆盖更严格
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/docs/*",
    "*/__main__.py",
    # 故意的非法语法 demo，无法被 import
    "src/electromind/core/hacked_agent.py",
    # 需要真实环境（docker / ssh / ACP server）才能测，纯单测覆盖不到
    "src/electromind/sandbox/backends/container.py",
    "src/electromind/sandbox/backends/ssh.py",
    "src/electromind/adapters/acp.py",
]

[tool.coverage.report]
# 终端报告里按行列出未覆盖的代码行
show_missing = true
skip_covered = false
# 排除琐碎的、不算真正逻辑的行
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
extend-exclude = [
    "src/electromind/core/hacked_agent.py",  # intentional invalid syntax demo
    ".claude/worktrees",  # temporary agent worktrees — not product code
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
