[project]
name = "pagent"
version = "0.1.1"
description = "Minimal OpenAI Chat Completions agent (session + tools)."
readme = "README.md"
authors = [
    { name = "gongyulei", email = "gongyulei@stu.xmu.edu.cn" },
]
requires-python = ">=3.11"
dependencies = [
    "docstring-parser>=0.18.0",
    "openai>=2.31.0",
]

[project.optional-dependencies]
search = ["ddgs>=7"]

[build-system]
requires = ["uv_build>=0.8.20,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
