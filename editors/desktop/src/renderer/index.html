<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>electromind Desktop</title>
  <link rel="icon" type="image/png" href="./logo-icon.png" />
  <!-- 严格 CSP：script-src 仅 'self'（启动错误处理与 React init 已外置为
       独立文件，无 inline script）；style 允许 inline（DOM 内联样式属性）；
       connect-src 仅本地 agent 的 HTTP/WS 端口。 -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; worker-src 'self' blob:; object-src 'none'; base-uri 'none'"
  />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./codicon.css" />
  <link rel="stylesheet" href="./chat.css" />
  <style>
    /* 启动遮罩：纯色，避免主界面闪一下 */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      background: #141517;
      transition: opacity 160ms ease-out;
    }

    html[data-boot="done"] #boot-splash {
      opacity: 0;
      pointer-events: none;
    }

    html[data-boot="done"] #boot-splash[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <div id="boot-splash" aria-hidden="true"></div>
  <div id="app"></div>
  <!-- 启动错误处理必须最先加载（renderer.js 之前），这样任何后续脚本
       抛错都会被捕获并渲染错误页。严格 CSP 下脚本全部外置。 -->
  <script src="./startup-error-handler.js"></script>
  <script src="./renderer.js"></script>
  <script src="./react-shell.js"></script>
  <script src="./react-init.js"></script>
</body>

</html>
