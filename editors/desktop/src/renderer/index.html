<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>electromind Desktop</title>
  <link rel="icon" type="image/png" href="./logo-icon.png" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./codicon.css" />
  <link rel="stylesheet" href="./chat.css" />
  <style>
    /* 启动遮罩：纯色，避免主界面闪一下 */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      background: #141517;
      transition: opacity 160ms ease-out;
    }

    html[data-boot="done"] #boot-splash {
      opacity: 0;
      pointer-events: none;
    }

    html[data-boot="done"] #boot-splash[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <div id="boot-splash" aria-hidden="true"></div>
  <div id="app"></div>
  <script>
    window.addEventListener("error", (event) => {
      const root = document.getElementById("app");
      if (!root || root.childElementCount > 0) return;
      const msg = event.error?.stack || event.message || "未知错误";
      // P4.5: 用 textContent 而非 innerHTML —— 错误信息可能含任意文本，
      // innerHTML 拼接未转义内容有 XSS 风险。
      const pre = document.createElement("pre");
      pre.style.padding = "16px";
      pre.style.color = "#f8fafc";
      pre.style.whiteSpace = "pre-wrap";
      pre.textContent = msg;
      root.textContent = "";
      root.appendChild(pre);
      document.documentElement.dataset.boot = "done";
      const splash = document.getElementById("boot-splash");
      if (splash) splash.hidden = true;
    });
  </script>
  <script src="./renderer.js"></script>
  <script src="./react-shell.js"></script>
  <script>
    // Initialize React shell after vanilla renderer mounts, passing the
    // live SessionManager so thread operations are not no-ops.  Poll
    // until the bundle has defined the entry — evaluation can be
    // delayed on slow loads / reloads, and a no-op call would leave the
    // React UI unmounted.
    (function initReactShell() {
      if (typeof window.__initReactShell__ === "function") {
        window.__initReactShell__(window.__electromindSM);
        return;
      }
      setTimeout(initReactShell, 100);
    })();
  </script>
</body>

</html>
