# pagent 配置项：runner / provider / sandbox（含 sandbox.container / sandbox.ssh）/ project / skills / repl / permission
# 这是运行时加载的包内默认层（BUNDLED_CONFIG）。全字段参考模板见 src/template/pagent.toml，
# 后续 breaking change 会把运行时默认迁去那里统一——两份的解析结果由测试锁死必须一致。
# 生效 home 二选一（配置 / threads / skills 同根）：
#   A ./.pagent/pagent.toml   B ~/.pagent/pagent.toml
# host_root（list_host_files / copy_from_host 的用户目录根）默认 = 启动时的 cwd；
# 用 [project.local] path 或 --project 显式绑定。它与生效 home 无关，--dev 不改 host_root。

[runner]
location = "local" # runner 进程跑在哪：local = 用户电脑（默认，当前唯一支持）；cloud = 云端 pod（保留，未实现）
max_turns = 12 # 单轮对话最大工具调用轮数

[provider]
# api_key 请写到当前 home 的 pagent.toml，勿提交进仓库；也可 export DEEPSEEK_API_KEY。
api_key = ""
model = "deepseek-v4-flash"
# base_url = ""  # 可选，覆盖 DeepSeek 默认 endpoint

[sandbox]
backend = "local" # local | container（自动探测 docker/podman）| docker | podman | ssh
command_policy = "workdir" # open | workdir — workdir 拦截 run_command 里的越界路径；所有后端通用
# 工具白名单：不设或空 = 放开全部 8 个；设了就只启用列出的（所有后端通用）。
# 下面即全集 8 个，删去不想启用的即可。
tools = [
  "run_command",
  "read_file",
  "write_file",
  "str_replace",
  "list_dir",
  "list_host_files",
  "copy_from_host",
  "copy_to_host",
]

# backend = container / docker / podman 时读此块。
# headless 浏览器（截图 / 渲染 HTML / PDF）：先构建 src/app/Dockerfile.browser
#     docker build -t pagent:browser -f src/app/Dockerfile.browser src/app
# 再把 image 改成 pagent:browser。
[sandbox.container]
container_ttl = 300 # 秒；容器主进程 sleep <ttl>，到期 --rm 自清理；0 或不设则用 sleep infinity
image = "pagent:latest" 

# backend = ssh 时读此块。
[sandbox.ssh]
config_path = "~/.ssh/config" 
host = "machine_root" # ~/.ssh/config 里的 Host 别名
# 远端工作目录：在登录家目录下建 pagent/，agent 只能操作该目录（会自动 mkdir）
workdir = "~/pagent"

# ── [project] 绑定资源，按 runner.location 分模式 ──────
# location=local：绑本地用户目录 → host_root（list_host_files / copy_from_host 的根）。
#   留空（默认）时 host_root 回退到启动 pagent 时的当前工作目录（cwd）。
# location=cloud：绑云端资源（仓库 / bucket…），cloud runner 未实现，选到即报错。
[project.local]
# path = ""  # 用户目录绝对/相对路径（等同 --project）
[project.cloud]
# repo = ""  # 云端资源标识（保留，未实现）

[skills]
# skill 扫描目录白名单。这里列的就是全部扫描位置，写了才扫、删了就没有。
# {home} 展开成当前生效的 pagent home（~/.pagent 或 --dev 下的 ./.pagent）。
# 新建对话时展开成绝对路径，冻结进 thread.toml 的 [agent] skills，运行时只读那份。
roots = ["{home}/skills"]

[agent]
# 主 agent 的进程内（harness）工具白名单，冻结进新建 thread.toml 的 [agent] tools。
# 可选：web_search、fetch_url、delegate_to_subagent（后者还需 thread.toml 配 [sub.*]）。
# 删去不想启用的即可；给空表 = 不挂任何进程内工具。
tools = ["web_search", "fetch_url"]

[repl]
assistant_label = "pagent" # 输出区助手回复前缀：{label}>
user_label = "you" # 输出区 / 输入行用户前缀：{label}>

[permission]
mode = "prompt" # prompt（默认，终端逐个审批）| auto（自动批准 run_command / copy_from_host）
