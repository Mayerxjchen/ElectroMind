# electromind 全局配置默认模板（全字段参考）
#
# 这是包内「唯一内置默认」：src/electromind/resources/default-config.toml。
# 运行时的配置事实源只有四层，优先级从低到高：
#
#   1. 本内置默认（缺失用户配置时物化到生效 home 的 config.toml）
#   2. ~/.electromind/config.toml                 → 用户设置
#   3. <project>/.electromind/config.toml         → 项目设置（仅受信任项目）
#   4. <project>/.electromind/config.local.toml   → 本机私有设置
#   外加 --config <file> 显式叠加（最高优先级）
#
# 新建对话时把 sandbox / agent / skills / [sub.*] 等冻结进该 thread 的 thread.toml；
# 之后以 thread.toml 为准。
#
# 生效 electromind home（数据根：配置 / threads / skills 同根，≠ 系统 $HOME）：
#   uv run electromind --dev  → ./.electromind/config.toml
#   uv run electromind        → ~/.electromind/config.toml
# 缺该文件时从本内置默认物化一份；只认这一个文件，另可用 --config <file> 叠加、CLI flag 覆盖。
#
# host_root（agent 能观察/取文件的用户目录，list_host_files / copy_from_host 的根）：
#   默认 = 启动 electromind 时的当前工作目录（cwd）；用 [project.local] path 或 --project 显式绑定。
#   注意它与 electromind home 无关：--dev 只改数据根，不改 host_root。

# ── [runner] 循环控制 ─────────────────────────────────
[runner]
location = "local" # runner 进程跑在哪：local = 用户电脑（默认，当前唯一支持）
max_turns = 24 # 单轮对话最大工具调用轮数。默认 24
# cloud = 云端 pod（保留，未实现；设了会报错）

# ── [provider] LLM 接入 ───────────────────────────────
[provider]
model = "deepseek-v4-flash" # 模型 id。默认 deepseek-v4-flash
# api_key 请写到生效 home 的 config.toml，勿提交进仓库；也可 export DEEPSEEK_API_KEY。
api_key = "" # 空串按未设处理，回退环境变量 DEEPSEEK_API_KEY
# base_url = ""                   # 可选，覆盖 DeepSeek 默认 endpoint

# ── [sandbox] 工具执行环境 ────────────────────────────
[sandbox]
backend = "local" # 标签：local | container（自动探测 docker/podman）| docker | podman | ssh
command_policy = "workdir" # open（不限）| workdir（拦截 run_command 越界路径）；所有后端通用
# tools 工具白名单：不设或空 = 放开全部 8 个；设了就只启用列出的（所有后端通用）。
# 下面即全集 8 个，删去不想启用的即可。
tools = [
  "run_command",
  "read_file",
  "write_file",
  "str_replace",
  "list_dir",
  "list_host_files",
  "copy_from_host",
  "copy_to_host",
]

# backend = container / docker / podman 时读此块。
# headless 浏览器（截图 / 渲染 HTML / PDF）：先构建 src/app/Dockerfile.browser
#     docker build -t electromind:browser -f src/app/Dockerfile.browser src/app
# 再把 image 改成 electromind:browser。
[sandbox.container]
container_ttl = 300 # 秒；容器 sleep <ttl> 后 --rm 自清理；0 或不设 = sleep infinity
image = "electromind:latest" # 容器镜像

# backend = ssh 时读此块。
[sandbox.ssh]
config_path = "~/.ssh/config" # SSH config 路径
host = "machine_root" # ~/.ssh/config 里的 Host 别名
workdir = "~/electromind" # 远端工作目录，agent 只能操作此目录（自动 mkdir）

# ── [project] 绑定资源，按 runner.location 分模式 ──────
# location=local：绑本地用户目录 → host_root（agent 能观察/取文件的宿主机根）。
#   list_host_files 只列它之下，copy_from_host 从它取，copy_to_host 写它的 artifacts/。
#   留空（默认）时 host_root 回退到启动 electromind 时的当前工作目录（cwd）。
[project.local]
# path = ""                       # 用户目录绝对/相对路径（等同 --project）

# location=cloud：绑云端资源（仓库 / bucket / 数据集…）。cloud runner 未实现，
# 选到 cloud 会直接报错，这里只作语义锚点，字段随实现细化。
[project.cloud]
# repo = ""                       # 云端资源标识（保留，未实现）

# ── [skills] 技能扫描 ─────────────────────────────────
[skills]
# skill 扫描目录白名单（字符串或字符串数组）。这里列的就是全部扫描位置，
# 写了才扫、删了就没有。{electromind_home} 展开成当前生效的数据根
# （~/.electromind 或 --dev 下的 ./.electromind；兼容旧写法 {home}）。新建对话时
# 展开成绝对路径，冻结进 thread.toml 的 [agent] skills，运行时只读那份。
roots = ["{electromind_home}/skills"]

# ── [agent] 主 agent 进程内工具 ───────────────────────
[agent]
# harness 工具白名单，冻结进新建 thread.toml 的 [agent] tools（运行时唯一事实来源）。
# 可选：web_search、fetch_url、delegate_to_subagent（后者还需至少配一个 [sub.*]）、
#       plan_propose、plan_step_update、artifact_register（G1b Plan/Artifact 工具桥）。
# 删去不想启用的即可；给空表 = 不挂任何进程内工具。
tools = ["web_search", "fetch_url", "plan_propose", "plan_step_update", "artifact_register"]

# ── [sub.<name>] 子 agent（新建对话时冻结进 thread.toml）──
# 主 agent 通过 delegate_to_subagent 委派；name 出现在工具的 type 枚举里。
# 字段：system / model（空=继承主 agent）/ backend（空=继承 thread；"none"=不开沙箱）/
#       sandbox_tools（空=放开全部）/ max_turns / workspace（空=共用 main；
#       非空 → workspaces/<name>/ 独立地盘）。
# 启用示例（取消注释，并在上面 tools 加上 "delegate_to_subagent"）：
#
# [sub.coder]
# system = "你是程序员，只负责实现与改代码。"
# max_turns = 24
# # model = ""
# # backend = "none"
# # sandbox_tools = ["read_file", "write_file", "str_replace", "run_command"]
# # workspace = "coder"
#
# [sub.researcher]
# system = "你只做调研与摘要，不改代码。"
# backend = "none"
# max_turns = 24

# ── [repl] 终端显示 ───────────────────────────────────
[repl]
assistant_label = "electromind" # 助手回复前缀 {label}>
user_label = "you" # 用户输入前缀 {label}>

# ── [permission] 工具审批 ─────────────────────────────
[permission]
mode = "prompt" # prompt（默认，终端逐个审批）| auto（自动批准危险工具）
