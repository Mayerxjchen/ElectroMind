<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pagent wire browser</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-2: #f0f0f3;
      --border: #e2e2e8;
      --text: #1c1c1e;
      --muted: #6b6b76;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --assistant-bg: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --reason-bg: #fffbeb;
      --reason-border: #f5e6b8;
      --reason-text: #854d0e;
      --tool-bg: #f0fdf4;
      --tool-border: #bbf7d0;
      --tool-text: #166534;
      --err: #dc2626;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
      --header-height: 4.25rem;
      --radius: 18px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; }
    html {
      height: 100%;
      color-scheme: light;
    }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app-body {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    .app-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .app-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: var(--header-height);
      padding: 0 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      box-sizing: border-box;
    }
    .app-header .brand h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .app-header .brand p {
      margin: 0.15rem 0 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .btn-ghost {
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .btn-ghost.active { color: var(--accent); border-color: var(--accent); }

    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-width: 48rem;
      width: 100%;
      margin: 0 auto;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1rem 0.5rem;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      padding: 3rem 1rem 2rem;
      color: var(--muted);
    }
    .welcome h2 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
    }
    .welcome p { margin: 0 0 1.25rem; font-size: 0.9rem; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    .chip {
      padding: 0.5rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .chip:hover {
      border-color: var(--accent);
      background: var(--surface);
    }

    .msg-row {
      display: flex;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-row.user .bubble { align-items: flex-end; }

    .avatar {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      margin-top: 2px;
    }
    .msg-row.assistant .avatar {
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      color: #1d4ed8;
    }
    .msg-row.user .avatar {
      background: var(--user-bg);
      color: var(--user-text);
    }

    .bubble-wrap { max-width: min(85%, 36rem); display: flex; flex-direction: column; gap: 0.35rem; }
    .bubble {
      padding: 0.7rem 1rem;
      border-radius: var(--radius);
      word-break: break-word;
      font-size: 0.95rem;
    }
    .msg-row.user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
      box-shadow: var(--shadow-sm);
    }
    .msg-row.assistant .bubble {
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }
    .msg-meta {
      font-size: 0.7rem;
      color: var(--muted);
      padding: 0 0.25rem;
    }
    .msg-row.user .msg-meta { text-align: right; }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 0.15rem 0;
    }
    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .think-block {
      margin-bottom: 0.5rem;
      border: 1px solid var(--reason-border);
      border-radius: var(--radius-sm);
      background: var(--reason-bg);
      overflow: hidden;
      font-size: 0.85rem;
    }
    .think-block summary {
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      color: var(--reason-text);
      font-weight: 500;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .think-block summary::-webkit-details-marker { display: none; }
    .think-block summary::before {
      content: "▸";
      font-size: 0.65rem;
      transition: transform 0.15s;
    }
    .think-block[open] summary::before { transform: rotate(90deg); }
    .think-body {
      padding: 0 0.75rem 0.65rem;
      color: var(--reason-text);
      opacity: 0.92;
      white-space: pre-line;
      word-break: break-word;
      max-height: 12rem;
      overflow-y: auto;
    }

    .tool-card {
      margin-bottom: 0.45rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--tool-border);
      border-radius: var(--radius-sm);
      background: var(--tool-bg);
      font-size: 0.8rem;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .tool-card .tool-name {
      color: var(--tool-text);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .tool-card .tool-args { color: var(--muted); word-break: break-all; }
    .tool-card .tool-result {
      margin-top: 0.35rem;
      padding-top: 0.35rem;
      border-top: 1px solid var(--tool-border);
      color: var(--text);
    }
    .tool-card.pending .tool-result { color: var(--muted); font-style: italic; }

    .turn-divider {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin: 0.65rem 0;
      position: relative;
    }
    .turn-divider::before,
    .turn-divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 28%;
      height: 1px;
      background: var(--border);
    }
    .turn-divider::before { left: 0; }
    .turn-divider::after { right: 0; }

    .answer-text {
      min-height: 1.25em;
      white-space: pre-line;
      line-height: 1.55;
    }

    .composer-wrap {
      flex-shrink: 0;
      padding: 0.75rem 1rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .composer {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      max-width: 48rem;
      margin: 0 auto;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-2);
    }
    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    textarea {
      flex: 1;
      resize: none;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      line-height: 1.45;
      max-height: 8rem;
      padding: 0.35rem 0.5rem;
      outline: none;
    }
    .send-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: var(--user-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 18px; height: 18px; }
    .stop-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: var(--err);
      color: #fff;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .stop-btn.visible { display: flex; }
    .stop-btn svg { width: 14px; height: 14px; fill: currentColor; }
    .composer-hint {
      max-width: 48rem;
      margin: 0.35rem auto 0;
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
    }

    .wire-drawer {
      flex-shrink: 0;
      width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-left: 1px solid transparent;
      transition: width 0.25s ease, border-color 0.25s ease;
      box-shadow: none;
    }
    .wire-drawer.open {
      width: min(400px, 42vw);
      border-left-color: var(--border);
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.06);
    }
    .wire-drawer-head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      min-height: var(--header-height);
      padding: 0 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      box-sizing: border-box;
    }
    .wire-drawer-head span {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.75rem;
      line-height: 1.2;
    }
    .wire-close {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }
    .wire-close:hover {
      background: var(--border);
      color: var(--text);
    }
    .wire-log {
      flex: 1;
      overflow: auto;
      padding: 0.75rem;
      margin: 0;
      font-family: ui-monospace, monospace;
      font-size: 0.68rem;
      line-height: 1.45;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--surface-2);
    }

    @media (max-width: 640px) {
      .wire-drawer.open {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(100%, 320px);
        z-index: 100;
        box-shadow: -8px 0 32px rgba(0, 0, 0, 0.12);
      }
    }

    .error-banner {
      margin: 0 1rem 0.5rem;
      padding: 0.6rem 0.85rem;
      border-radius: 10px;
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid var(--err);
      color: var(--err);
      font-size: 0.85rem;
      display: none;
    }
    .error-banner.show { display: block; }
  </style>
</head>
<body>
  <div class="app-body">
    <div class="app-column">
  <header class="app-header">
    <div class="brand">
      <h1>pagent wire browser</h1>
      <p>JSON-RPC 2.0</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-ghost" id="toggleWire" title="显示原始 Wire 行">Wire 日志</button>
      <button type="button" class="btn-ghost" id="clearChat" title="清空对话">新对话</button>
    </div>
  </header>

  <div class="chat-main">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h2>你好，我是小帕</h2>
        <p>通过 Wire 协议流式对话，支持工具调用与思考过程展示。</p>
        <div class="chips">
          <button type="button" class="chip" data-prompt="你好，你能帮我做什么？">打个招呼</button>
          <button type="button" class="chip" data-prompt="用简单的话解释一下什么是大语言模型">什么是 LLM</button>
          <button type="button" class="chip" data-prompt="168 乘以 25 等于多少？">帮我算个数</button>
        </div>
      </div>
    </div>

    <div class="error-banner" id="errorBanner"></div>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea
          id="input"
          rows="1"
          placeholder="输入消息…"
          autocomplete="off"
        ></textarea>
        <button type="submit" class="send-btn" id="send" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
        <button type="button" class="stop-btn" id="stop" aria-label="停止生成">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        </button>
      </form>
      <p class="composer-hint">Enter 发送 · Shift+Enter 换行 · 生成中可点停止</p>
    </div>
  </div>
    </div>

  <aside class="wire-drawer" id="wireDrawer" aria-hidden="true">
    <div class="wire-drawer-head">
      <span>Wire · NDJSON</span>
      <button type="button" class="wire-close" id="closeWire" aria-label="关闭">×</button>
    </div>
    <pre class="wire-log" id="wireLog"></pre>
  </aside>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const welcomeEl = document.getElementById("welcome");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const stopBtn = document.getElementById("stop");
    const wireLog = document.getElementById("wireLog");
    const wireDrawer = document.getElementById("wireDrawer");
    const toggleWire = document.getElementById("toggleWire");
    const closeWire = document.getElementById("closeWire");
    const clearChat = document.getElementById("clearChat");
    const errorBanner = document.getElementById("errorBanner");

    let streaming = false;
    let assistantState = null;
    let abortController = null;

    function setComposerStreaming(on) {
      streaming = on;
      sendBtn.disabled = on;
      sendBtn.style.display = on ? "none" : "flex";
      stopBtn.classList.toggle("visible", on);
    }

    function hideWelcome() {
      if (welcomeEl) welcomeEl.remove();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showError(text) {
      errorBanner.textContent = text;
      errorBanner.classList.add("show");
    }

    function hideError() {
      errorBanner.classList.remove("show");
    }

    function formatTime() {
      return new Date().toLocaleTimeString("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function appendUserMessage(text) {
      hideWelcome();
      const row = document.createElement("div");
      row.className = "msg-row user";
      row.innerHTML = `
        <div class="avatar" aria-hidden="true">你</div>
        <div class="bubble-wrap">
          <div class="bubble"></div>
          <div class="msg-meta">${formatTime()}</div>
        </div>
      `;
      row.querySelector(".bubble").textContent = text;
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function createAssistantMessage() {
      hideWelcome();
      const row = document.createElement("div");
      row.className = "msg-row assistant";
      row.innerHTML = `
        <div class="avatar" aria-hidden="true">帕</div>
        <div class="bubble-wrap">
          <div class="bubble">
            <div class="bubble-inner">
              <div class="typing" aria-label="正在输入">
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>
          <div class="msg-meta" data-meta>正在思考…</div>
        </div>
      `;
      messagesEl.appendChild(row);
      scrollToBottom();

      const inner = row.querySelector(".bubble-inner");
      return {
        row,
        inner,
        meta: row.querySelector("[data-meta]"),
        thinkDetails: null,
        thinkBody: null,
        tools: new Map(),
        answerEl: null,
        answerRaw: "",
        thinkRaw: "",
        typingEl: inner.querySelector(".typing"),
      };
    }

    /** 压缩流式文本里多余的空行，避免气泡里出现大片空白 */
    function normalizeDisplayText(text) {
      if (!text) return "";
      return text
        .replace(/\r\n/g, "\n")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n[ \t]+/g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .replace(/^\n+/, "")
        .replace(/\n+$/, "");
    }

    function appendAnswerDelta(s, chunk) {
      const el = ensureAnswerEl(s);
      s.answerRaw += chunk || "";
      el.textContent = normalizeDisplayText(s.answerRaw);
    }

    function appendThinkDelta(s, chunk) {
      const body = ensureThinkBlock(s);
      s.thinkRaw += chunk || "";
      body.textContent = normalizeDisplayText(s.thinkRaw);
    }

    function ensureAnswerEl(state) {
      if (state.answerEl) return state.answerEl;
      if (state.typingEl) {
        state.typingEl.remove();
        state.typingEl = null;
      }
      const el = document.createElement("div");
      el.className = "answer-text";
      state.inner.appendChild(el);
      state.answerEl = el;
      return el;
    }

    function ensureThinkBlock(state) {
      if (state.thinkDetails) return state.thinkBody;
      const details = document.createElement("details");
      details.className = "think-block";
      details.open = true;
      details.innerHTML = `
        <summary>思考过程</summary>
        <div class="think-body"></div>
      `;
      state.inner.insertBefore(details, state.inner.firstChild);
      state.thinkDetails = details;
      state.thinkBody = details.querySelector(".think-body");
      return state.thinkBody;
    }

    function addTurnDivider(state) {
      const div = document.createElement("div");
      div.className = "turn-divider";
      div.textContent = "继续回答";
      state.inner.appendChild(div);
    }

    function handleWire(msg) {
      if (!assistantState) return;
      const { method, params = {} } = msg;
      const s = assistantState;

      switch (method) {
        case "RunBegin":
          s.meta.textContent = "正在回复…";
          break;
        case "TurnBegin":
          if (params.turn > 0) addTurnDivider(s);
          s.meta.textContent = `第 ${params.turn + 1} 轮…`;
          break;
        case "TextDelta":
          appendAnswerDelta(s, params.text);
          scrollToBottom();
          break;
        case "ReasoningDelta":
          appendThinkDelta(s, params.text);
          scrollToBottom();
          break;
        case "ToolCallBegin": {
          const card = document.createElement("div");
          card.className = "tool-card pending";
          card.id = "tool-" + params.tool_call_id;
          card.innerHTML = `
            <div class="tool-name">${escapeHtml(params.name)}</div>
            <div class="tool-args">${escapeHtml(params.arguments || "")}</div>
            <div class="tool-result">执行中…</div>
          `;
          if (s.typingEl) {
            s.inner.insertBefore(card, s.typingEl);
          } else {
            s.inner.insertBefore(card, s.answerEl || null);
          }
          s.tools.set(params.tool_call_id, card);
          scrollToBottom();
          break;
        }
        case "ToolResult": {
          const card = s.tools.get(params.tool_call_id);
          if (card) {
            card.classList.remove("pending");
            card.querySelector(".tool-result").textContent =
              params.content || "";
          }
          scrollToBottom();
          break;
        }
        case "TurnEnd":
          s.meta.textContent = params.stopped ? "生成中…" : "调用工具后继续…";
          break;
        case "RunEnd": {
          if (s.typingEl) {
            s.typingEl.remove();
            s.typingEl = null;
          }
          if (!s.answerEl && !s.thinkBody && s.tools.size === 0) {
            s.answerRaw = params.content || "";
            ensureAnswerEl(s).textContent =
              normalizeDisplayText(s.answerRaw) || "（无文本回复）";
          } else if (s.answerEl && params.content) {
            s.answerRaw = params.content;
            s.answerEl.textContent = normalizeDisplayText(s.answerRaw);
          }
          const usage = params.usage;
          const tokens = usage?.total_tokens;
          s.meta.textContent = tokens
            ? `${formatTime()} · ${tokens} tokens`
            : formatTime();
          if (s.thinkDetails && !s.thinkBody?.textContent) {
            s.thinkDetails.remove();
          }
          scrollToBottom();
          break;
        }
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function appendWireLine(line) {
      wireLog.textContent += line + "\n";
      wireLog.scrollTop = wireLog.scrollHeight;
    }

    async function consumeNdjson(response) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let newline;
        while ((newline = buffer.indexOf("\n")) >= 0) {
          const line = buffer.slice(0, newline).trim();
          buffer = buffer.slice(newline + 1);
          if (!line) continue;
          appendWireLine(line);
          handleWire(JSON.parse(line));
        }
      }
      const tail = buffer.trim();
      if (tail) {
        appendWireLine(tail);
        handleWire(JSON.parse(tail));
      }
    }

    async function sendMessage(message) {
      if (!message || streaming) return;

      setComposerStreaming(true);
      hideError();
      appendUserMessage(message);
      assistantState = createAssistantMessage();
      abortController = new AbortController();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
          signal: abortController.signal,
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || res.statusText || String(res.status));
        }
        await consumeNdjson(res);
      } catch (err) {
        if (err.name === "AbortError") {
          if (assistantState?.typingEl) assistantState.typingEl.remove();
          if (assistantState) {
            assistantState.meta.textContent = "已停止";
            if (!assistantState.answerEl) {
              ensureAnswerEl(assistantState).textContent = "（生成已中断）";
            }
          }
        } else {
          showError(String(err.message || err));
          if (assistantState?.typingEl) assistantState.typingEl.remove();
          const fail = document.createElement("div");
          fail.className = "answer-text";
          fail.style.color = "var(--err)";
          fail.textContent = "回复失败，请检查 API Key 或网络。";
          assistantState.inner.appendChild(fail);
          assistantState.meta.textContent = "失败";
        }
      } finally {
        abortController = null;
        setComposerStreaming(false);
        sendBtn.style.display = "flex";
        assistantState = null;
        input.focus();
      }
    }

    stopBtn.addEventListener("click", () => {
      abortController?.abort();
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      input.style.height = "auto";
      sendMessage(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 128) + "px";
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const prompt = chip.dataset.prompt;
        if (prompt) sendMessage(prompt);
      });
    });

    function setWireOpen(open) {
      wireDrawer.classList.toggle("open", open);
      toggleWire.classList.toggle("active", open);
      wireDrawer.setAttribute("aria-hidden", open ? "false" : "true");
    }

    toggleWire.addEventListener("click", () => {
      setWireOpen(!wireDrawer.classList.contains("open"));
    });

    closeWire.addEventListener("click", () => setWireOpen(false));

    clearChat.addEventListener("click", () => {
      if (streaming) return;
      messagesEl.innerHTML = `
        <div class="welcome" id="welcome">
          <h2>你好，我是小帕</h2>
          <p>通过 Wire 协议流式对话，支持工具调用与思考过程展示。</p>
          <div class="chips">
            <button type="button" class="chip" data-prompt="你好，你能帮我做什么？">打个招呼</button>
            <button type="button" class="chip" data-prompt="用简单的话解释一下什么是大语言模型">什么是 LLM</button>
            <button type="button" class="chip" data-prompt="168 乘以 25 等于多少？">帮我算个数</button>
          </div>
        </div>
      `;
      wireLog.textContent = "";
      hideError();
      document.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          if (chip.dataset.prompt) sendMessage(chip.dataset.prompt);
        });
      });
    });

    input.focus();
  </script>
</body>
</html>
