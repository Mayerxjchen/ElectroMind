name: Coverage

# 跑测试 + 收集覆盖率，上传到 Codecov：
# - PR 里显示 diff 覆盖率评论
# - README 徽章显示总覆盖率
# 公开仓库无需 token；私有仓库需在 repo secrets 加 CODECOV_TOKEN

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Sync dev deps
        run: uv sync --group dev --extra search --frozen

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=src --cov-report=xml --cov-report=term -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false # 上传失败不让 CI 红
          # token: ${{ secrets.CODECOV_TOKEN }} # 仅私有仓库需要
