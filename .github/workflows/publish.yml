# PyPI Trusted Publishing (OIDC): no long-lived PYPI token in repo secrets.
# One-time PyPI setup: https://docs.pypi.org/trusted-publishers/
# Create a "Pending publisher" for this repo + workflow filename (publish.yml).

name: Publish Release Assets

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install VS Code extension deps
        working-directory: editors/vscode
        run: npm ci

      - name: Type check VS Code extension
        working-directory: editors/vscode
        run: npm run check

      - name: Build VS Code extension
        working-directory: editors/vscode
        run: npm run compile

      - name: Package VS Code extension
        working-directory: editors/vscode
        run: npm run package

      - name: Upload VS Code extension to release
        uses: softprops/action-gh-release@v2
        with:
          files: editors/vscode/*.vsix

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: editors/desktop/package-lock.json

      - name: Install VS Code webview deps (shared by desktop typecheck)
        working-directory: editors/vscode
        run: npm ci

      - name: Install Desktop deps
        working-directory: editors/desktop
        run: npm ci

      - name: Type check Desktop
        working-directory: editors/desktop
        run: npm run check

      - name: Package Desktop (${{ matrix.platform }} ${{ matrix.arch }})
        working-directory: editors/desktop
        run: node scripts/package.js --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Upload Desktop app to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            editors/desktop/release/*.zip
            editors/desktop/release/*.tar.gz
