# PyPI Trusted Publishing (OIDC): no long-lived PYPI token in repo secrets.
# One-time PyPI setup: https://docs.pypi.org/trusted-publishers/
# Create a "Pending publisher" for this repo + workflow filename (publish.yml).

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
