# ElectroMind 最小 CI（P5.3）：
#   1. Python tests (ruff + pytest + coverage)          — 服务端 / 库
#   2. TypeScript check (tsc --noEmit)                  — Desktop 类型
#   3. Desktop unit tests (node --test)                 — Desktop 纯逻辑
#   4. CDP tests (electron --remote-debugging-port)     — Desktop 渲染冒烟
#   5. macOS packaged-app smoke                          — 打包产物能启动
#
# 只跑两条：核心（py + ts + desktop unit + cdp），以及 macOS 打包冒烟。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  core:
    name: Python + TypeScript + Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv + xvfb
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Python sync
        run: uv sync --group dev --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # container MUST 验收（test_skill_mount_parity）要求镜像已预加载、
      # 测试禁止自动 pull：先在 CI 构建 electromind:latest 再跑 pytest。
      # 注意：ELECTROMIND_TEST_CONTAINER_IMAGE 必须是真实镜像名——
      # 留空/缺省会让该测试硬失败（禁止 skip 绕过 MUST）。
      - name: Build container test image
        run: docker build -t electromind:latest -f src/app/Dockerfile src/app

      # 失败时把 pytest 输出尾部以 ::error:: 注解发布（run 页面与
      # checks API 均可见，PR 上直接显示失败原因），避免盲查日志。
      - name: pytest + coverage
        run: |
          set +e
          uv run pytest tests/ --cov=src --cov-report=json -q 2>&1 | tee /tmp/pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            tail -n 40 /tmp/pytest.log | tr '\n' '%0A' | head -c 4000 > /tmp/pytest-fail.txt
            echo "::error file=tests/,title=pytest failures::$(cat /tmp/pytest-fail.txt)"
          fi
          exit "$code"
        env:
          COVERAGE_MIN: "78"
          ELECTROMIND_TEST_CONTAINER_IMAGE: "electromind:latest"

      - name: Desktop deps + compile
        working-directory: editors/desktop
        run: |
          npm ci || npm install
          npm run compile

      - name: TypeScript check
        working-directory: editors/desktop
        run: npm run check

      - name: Desktop unit tests (node --test)
        working-directory: editors/desktop
        run: |
          set +e
          node --test $(ls scripts/*.test.mjs | grep -Ev 'cdp-smoke|package-agent') 2>&1 | tee /tmp/unit.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -n -A 30 '^not ok' /tmp/unit.log | tr '\n' '%0A' | head -c 4000 > /tmp/unit-fail.txt
            echo "::error file=editors/desktop,title=desktop unit failures::$(cat /tmp/unit-fail.txt)"
          fi
          exit "$code"

      # P5.2: 打包 Agent 校验逻辑（自包含测试：临时目录 + 合成 Mach-O）。
      - name: Package agent tests
        working-directory: editors/desktop
        run: node --test scripts/package-agent.test.mjs

      # P5.3: CDP 冒烟（真实 Electron 渲染；Linux 用 xvfb）。与纯单元测试
      # 分层，失败归因清晰。
      - name: CDP smoke (electron renderer loads)
        working-directory: editors/desktop
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a node --test scripts/cdp-smoke.test.mjs
          else
            node --test scripts/cdp-smoke.test.mjs
          fi
        env:
          ELECTROMIND_HOME: /tmp/electromind-ci-smoke

  package-smoke:
    name: macOS packaged-app smoke
    runs-on: macos-14
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Desktop deps + compile
        working-directory: editors/desktop
        run: |
          npm ci || npm install
          npm run compile

      - name: TypeScript check
        working-directory: editors/desktop
        run: npm run check

      - name: Desktop unit tests
        working-directory: editors/desktop
        run: |
          set +e
          node --test $(ls scripts/*.test.mjs | grep -Ev 'cdp-smoke|package-agent') 2>&1 | tee /tmp/unit.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -n -A 30 '^not ok' /tmp/unit.log | tr '\n' '%0A' | head -c 4000 > /tmp/unit-fail.txt
            echo "::error file=editors/desktop,title=desktop unit failures::$(cat /tmp/unit-fail.txt)"
          fi
          exit "$code"

      - name: Package agent tests
        working-directory: editors/desktop
        run: node --test scripts/package-agent.test.mjs

      - name: CDP smoke (electron renderer loads)
        working-directory: editors/desktop
        run: node --test scripts/cdp-smoke.test.mjs
        env:
          ELECTROMIND_HOME: /tmp/electromind-ci-smoke-mac

      # P5.1: 无 --agent-bin 且 dist/ 无产物 → 打包必须失败（禁止静默降级
      # Companion）。这里用 --allow-companion 显式跑打包冒烟（CI 不构建
      # PyInstaller agent，属于有意为之的开发验证）。
      - name: Package (explicit allow-companion)
        working-directory: editors/desktop
        run: node scripts/package.js --allow-companion
