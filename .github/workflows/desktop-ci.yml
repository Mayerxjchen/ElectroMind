# 仅打包桌面端：验证 macOS/Windows/Linux 三平台能否各自打出包。
# 用 tag 触发，不创建 Release、不发 PyPI，产物走 artifact 供下载验证。
name: Desktop Build Check

on:
  push:
    tags:
      - "desktop-ci-*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: editors/desktop/package-lock.json

      - name: Install VS Code webview deps (shared by desktop typecheck)
        working-directory: editors/vscode
        run: npm ci

      - name: Install Desktop deps
        working-directory: editors/desktop
        run: npm ci

      - name: Type check Desktop
        working-directory: editors/desktop
        run: npm run check

      - name: Package Desktop (${{ matrix.platform }} ${{ matrix.arch }})
        working-directory: editors/desktop
        run: node scripts/package.js --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: pagent-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            editors/desktop/release/*.zip
            editors/desktop/release/*.tar.gz
          if-no-files-found: error
