name: Ruff

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dev deps, Ruff & pytest
        run: |
          uv sync --group dev --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest tests/ -q
