# Knowledge reference sync mapping (A+ self-contained skills).
#
# The canonical authoring sources live in this directory
# (skills/knowledge/).  Each skill carries its own committed runtime copies
# under <skill>/references/knowledge/ — this mapping declares which source is
# copied where.  Copies are byte-identical to their source; the generated
# sync-manifest.json records target -> {source, sha256}.
#
# All paths are repo-root relative.  Reconcile with:
#     uv run scripts/sync-skill-references.py
# Verify (read-only) with:
#     uv run scripts/sync-skill-references.py --check
#
# 推导依据（W4）：各 skill 对 knowledge/<doc> 的实际引用 + 路由语义 +
# knowledge 文档互链闭包（electronic-structure → bonding-analysis/
# periodic-electrostatics/surface-thermodynamics 等，成对同步）。

[[references]]
source = "skills/knowledge/bonding-analysis.md"
targets = [
  "skills/procedures/comp-chem-workflow/references/knowledge/bonding-analysis.md",
  "skills/procedures/research-orchestrator/references/knowledge/bonding-analysis.md",
  "skills/procedures/review-response/references/knowledge/bonding-analysis.md",
  "skills/tools/cp2k/references/knowledge/bonding-analysis.md",
  "skills/tools/lobster/references/knowledge/bonding-analysis.md",
  "skills/tools/multiwfn/references/knowledge/bonding-analysis.md",
  "skills/tools/report/references/knowledge/bonding-analysis.md",
  "skills/tools/vasp/references/knowledge/bonding-analysis.md",
  "skills/tools/vaspkit/references/knowledge/bonding-analysis.md",
]

